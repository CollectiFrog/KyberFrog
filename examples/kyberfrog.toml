# Example KyberFrog machine config — kyberfrog.toml.
#
# KyberFrog keeps two kinds of files, in %APPDATA%\kyberfrog\ on Windows and
# ~/.config/kyberfrog/ on Linux:
#
#   kyberfrog.toml          THIS file: what belongs to this machine (install
#                           paths, ports, encoder, UI) and which setup is loaded.
#                           Tray → « Ouvrir config » opens it.
#   setups/<name>.toml      a setup: the transmitters and viewers of one show,
#                           plus their auth / TLS / input settings. Portable —
#                           the dashboard saves, loads, exports and imports
#                           them. See setups/setup-default.toml next to this file.
#
# Both are written on first run. You normally edit transmitters and viewers from
# the dashboard (http://<this-pc>:7700/); the settings below are file-only.
# Restart KyberFrog after editing either file by hand.
#
# A pre-0.3 single file carrying [emission] / [reception] inline still loads:
# KyberFrog moves those halves into setups/setup-default.toml on first start.

# Where the installed Kyber binaries live (kycontroller.exe + DLLs). Defaults to
# the folder of kyberfrog.exe when kycontroller.exe sits next to it (the
# installer's layout), else C:\Program Files\KyberFrog.
# kyber_install_dir = 'C:\Program Files\KyberFrog'

# Path to kyclient (a bare name resolves via PATH).
# kyclient_path = 'kyclient.exe'

# The single web UI / GET /transmitters discovery port (browse
# http://<this-pc>:7700/). Bound on all interfaces so the LAN reaches it.
web_port = 7700

# mDNS/DNS-SD auto-discovery (_kyber._tcp.local.): this machine announces its
# transmitters on the LAN and browses for the other machines', so the viewer
# form can offer detected emitters instead of a hand-typed IP. Link-local only
# (no VLAN/router traversal); needs UDP 5353 through the Windows firewall (the
# installer adds the rule). Set to false to turn both halves off.
# mdns = true

# Linux only — screen-capture backend: "auto" (default: picked from the
# graphical session at every transmitter start), or a forced "xcb" (X11),
# "wlroots" (sway, Hyprland, river), "drm" (no display server) or "nvfbc".
# screen_backend = "auto"

# Video encoder for every transmitter of this machine: "auto" (default: the
# hardware encoder of the main GPU — AMF on AMD, NVENC on NVIDIA — else x264),
# "x264" (CPU), "amf", "nvenc" or "qsv". Also in the web UI, Options → Video
# encoding. A machine setting: an `encoder` inside a setup is ignored.
# encoder = "auto"

# The setup loaded at startup: the stem of a file under setups/ (no extension).
# The dashboard's setup picker changes it.
active_setup = "setup-default"

# Dashboard preferences, also set from Options in the web UI.
[ui]
theme = "dark"   # "dark" or "light"
lang = "fr"      # "fr" or "en"
