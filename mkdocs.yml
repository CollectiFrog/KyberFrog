site_name: KyberFrog
site_description: >-
  Orchestration layer on top of Kyber (QUIC video transport) — publish any
  source as N independent transmitters and supervise the viewers, for
  low-latency LAN streaming (a drop-in replacement for NDI).
site_url: https://kyber-anysource-b41fc4.gitlab.io/
repo_url: https://gitlab.com/kyber-frog/kyberfrog
repo_name: kyber-frog/kyberfrog
edit_uri: -/edit/main/docs/
copyright: KyberFrog — AGPL-3.0

theme:
  name: material
  language: en
  icon:
    logo: material/transit-connection-variant
    repo: fontawesome/brands/gitlab
  # Self-hosted (see docs/assets/stylesheets/fonts.css): the project tracks the
  # app's call to fonts.googleapis.com as a bug (#29), so the docs site does not
  # make one either.
  font: false
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.instant
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy

nav:
  - Home: index.md
  - User Manual:
      - user/index.md
      - Installation: user/installation.md
      - Getting started: user/getting-started.md
      - Troubleshooting: user/troubleshooting.md
      - FAQ: user/faq.md
  - Developer:
      - dev/index.md
      - Backlog: dev/backlog.md
      - Architecture: dev/architecture.md
      - Building from source: dev/building.md
      - Releasing & CI: dev/releasing.md
      - Contributing: dev/contributing.md
      - Plans &amp; audits:
          - "Spout passthrough (#27)": dev/plan-spout-passthrough.md
          - "End-to-end latency (#28)": dev/plan-latency.md
          - "Latency bench, results (#28-4)": dev/bench-latency.md
          - "Remote desktop (#17)": dev/plan-remote-desktop.md
          - "Sources &amp; exports (#18, #26)": dev/plan-sources-exports.md
          - "Cockpit hover (#22)": dev/plan-ui-hover.md
          - "Linux amd64 architecture": dev/plan-linux-amd64.md
          - "Linux — per-feature status": dev/todo-linux.md
          - "Spout zero-copy (#28-2)": dev/plan-spout-zerocopy.md
          - "Tauri shell (#21)": dev/plan-tauri-shell.md
          - "Fork chain inventory (#25)": dev/audit-fork-chain.md
          - "Fork chain process (#24, #25)": dev/plans-fork-restructure.md
          - "Greenfield architecture (prospective)": dev/archi-greenfield.md
      - Archive:
          - "Shipped items": dev/backlog-archive.md
          - "E2E: Spout output": E2E-spout-output.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  # Mermaid diagrams (```mermaid fences) — Material ships the renderer as soon
  # as this custom fence is declared. GitLab renders the same fences natively.
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_css:
  - assets/stylesheets/fonts.css
  - assets/stylesheets/kyberfrog.css

plugins:
  - search
