# KyberFrog CI/CD — build the single-file installer, publish it on a v* tag.
#
#   test         cargo test (workspace) on the Linux host target — fast, no fork
#                bundle needed; gates the installer (a test failure blocks
#                package + release).
#   build-ui     npm build the React dashboard → ui/dist (Node image), bundled
#                next to kyberfrog.exe by the installer.
#   build-fork   clone+build the Kyber fork bundle (kycontroller/kyavserver/
#                kyclient + DLLs + libVLC plugins) via kyber-desktop/build-win32.sh.
#                Heavy; cached in the Generic Package Registry, keyed by the
#                resolved kyber-desktop commit SHA.
#   installer    cargo-build kyberfrog.exe, then makensis -> KyberFrog-Setup.exe
#                (packaging/build-installer.sh does both). The git tag is the sole
#                version source (KYBERFROG_VERSION baked in + NSIS); no Cargo bump.
#   release      on a v* tag: upload the setup to the Generic Package Registry and
#                create a GitLab Release that links it.
#
# Pendant Linux amd64 de la même chaîne (docs/dev/plan-linux-amd64.md) :
#   build-fork-linux  bundle Linux du fork via kyber-desktop/build-linux.sh, même
#                     cache Generic Package Registry keyé par le SHA résolu.
#   deb               cargo-build kyberfrog + packaging/linux/build-deb.sh ->
#                     kyberfrog_<version>_amd64.deb (pendant de `installer`).
#   release-deb       sur un tag v* : publie le .deb et l'attache à la release
#                     déjà créée, sans jamais retenir la release Windows.
#
# Pendant arm64 (#35, S1 de KyberFrog Satellite) :
#   build-fork-linux-arm64  cache **seul** : le bundle arm64 est construit sur le
#                           poste (émulation qemu, sans limite de 3 h) et poussé
#                           dans le Generic Package Registry à la clé du SHA.
#   deb-arm64               kyberfrog_<version>_arm64.deb sur un runner ARM SaaS,
#                           + les preuves ELF/glibc que réclame le Pi 5.
#   image-debian-linux-arm64  la même image, construite en natif par Kaniko.
# Toute cette branche est `allow_failure` : elle ne retient ni Windows ni amd64.
#
# SaaS-runner setup: jobs are untagged so GitLab.com shared runners pick them up
# (the heavy/docker tags only existed on self-hosted runners we don't have yet).
# The mingw image must live in THIS project's registry — a kyber-frog CI token
# can't pull from kyber.stream's private registry. Push it once (tag pinned later):
#   docker login registry.gitlab.com
#   docker tag kyber/debian-win64:local "$CI_REGISTRY_IMAGE/debian-win64:latest"
#   docker push "$CI_REGISTRY_IMAGE/debian-win64:latest"

variables:
  WIN64_IMAGE: ${CI_REGISTRY_IMAGE}/debian-win64:latest
  # Linux build image — built and pushed by the `image-debian-linux` job below
  # (source: ops/docker-images/debian-linux/). Unlike the win64 one, this image
  # IS reproducible from this repo.
  LINUX_AMD64_IMAGE: ${CI_REGISTRY_IMAGE}/debian-linux:latest-amd64
  # Fork repo is flat under this project's group: <namespace>/kyber-desktop.
  KYBER_DESKTOP_PROJECT: ${CI_PROJECT_NAMESPACE}/kyber-desktop
  FORK_PACKAGE: kyberfrog-fork-bundle           # generic-package name for the cache
  FORK_BUNDLE_ZIP: kyberfrog-fork-bundle.zip
  # Linux counterpart of the two above. build-linux.sh hardcodes the staging
  # name kyber-linux-x86_64 on our base, so amd64 needs no fork-side change.
  FORK_PACKAGE_LINUX: kyberfrog-fork-bundle-linux-amd64
  FORK_BUNDLE_LINUX: kyber-linux-x86_64.tar.bz2
  # Pendant arm64 (#35 / S1 du Satellite, docs/dev/plan-linux-amd64.md § arm64).
  # Le bundle s'appelle kyber-linux-aarch64 parce que build-linux.sh le nomme
  # d'après `uname -m` depuis le bump de packaging/versions.sh ci-dessous, et
  # c'est exactement ce que `build-deb.sh -a arm64` va chercher.
  LINUX_ARM64_IMAGE: ${CI_REGISTRY_IMAGE}/debian-linux:latest-arm64
  FORK_PACKAGE_LINUX_ARM64: kyberfrog-fork-bundle-linux-arm64
  FORK_BUNDLE_LINUX_ARM64: kyber-linux-aarch64.tar.bz2
  # Le seul runner ARM du tier gratuit GitLab.com (2 vCPU / 8 Go). Assez pour
  # empaqueter, pas pour construire le fork — voir le job `deb-arm64`.
  ARM64_RUNNER_TAG: saas-linux-small-arm64
  GIT_SUBMODULE_STRATEGY: none                  # kyberfrog has no submodules

stages:
  - build
  - package
  - release
  - pages

# Tout tourne sur le runner du poste (56540572, tag `kyberfrog-local`) : les
# minutes CI GitLab.com sont comptées. Les runners partagés restent activés sur
# le projet pour la seule chaîne arm64 — `image-debian-linux-arm64` et
# `deb-arm64` remplacent ce tag par `saas-linux-small-arm64`. Sans ce défaut, un
# job non tagué part sur `saas-linux-small-amd64` dès qu'il est libre avant le
# poste. Poste éteint = pipeline en attente, c'est voulu.
default:
  tags:
    - kyberfrog-local

# Surface des pipelines, déclarée UNE fois ici plutôt que job par job : MR,
# `dev`, la branche par défaut, et les tags. Conséquences voulues :
#
#   * une branche de travail (`feat/*`, `fix/*`…) ne déclenche rien tant qu'elle
#     n'a pas de MR — on ne paie des minutes que pour du code proposé à
#     l'intégration ;
#   * **pas de doublon** : quand une branche a une MR ouverte, seul le pipeline
#     de MR tourne. Sans la règle `when: never`, chaque push sur `dev` avec une
#     MR ouverte vers `main` en lançait deux, identiques ;
#   * **aucun job manuel** dans toute la chaîne : ce qui est déclenché est
#     déclenché automatiquement, et ce qui n'a pas lieu d'être n'apparaît pas.
#
# Les jobs sans `rules:` tournent donc dans tous ces pipelines. Ceux qui en ont
# ne font que *restreindre* : release sur tag `v*`, pages sur la branche par
# défaut, l'image Docker sur changement de son Dockerfile.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH == "dev"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

# Chaîne Linux — voir docs/dev/plan-linux-amd64.md.
#
# Depuis que le job `deb` existe et consomme le bundle, la chaîne Linux est un
# citoyen de première classe : elle tourne dans les mêmes pipelines que la
# chaîne Windows, automatiquement, et elle est bloquante — un build Linux cassé
# doit se voir avant le merge, exactement comme un build Windows cassé.
#
# Une seule exception : **sur un tag, `allow_failure: true`**. Une release
# Windows ne doit jamais être retenue par la chaîne Linux (§ 3.4 du plan) ; le
# `.deb` est attaché à la release par un job séparé, `release-deb`, qui ne fait
# rien s'il n'y a pas de paquet — donc pas de lien mort, pas de release bloquée.
#
# La boucle de dev Linux, elle, reste **locale**
# (`packaging/linux/build-fork-local.sh`, docker sur le poste) : ~20 min contre
# ~1 h 30 en CI. La CI produit l'artefact *officiel*, reproductible depuis le SHA
# pinné dans `packaging/versions.sh`.
.linux-rules: &linux_rules
  - if: $CI_COMMIT_TAG
    allow_failure: true
  - when: on_success

# Chaîne arm64 — `allow_failure` **partout**, pas seulement sur un tag.
#
# Deux raisons, et elles sont temporaires :
#
#   1. Le bundle fork arm64 n'est pas produit par la CI (voir
#      `build-fork-linux-arm64`) : il est construit sur le poste et poussé à la
#      main dans le registre. Entre un bump de `packaging/versions.sh` et cet
#      upload, la chaîne arm64 est rouge par construction — bloquante, elle
#      retiendrait des MR qui n'ont rien à voir avec arm64.
#   2. Le `.deb` arm64 n'a encore été installé sur aucun Pi (#46 S1, matériel
#      non assemblé). Un artefact qu'on ne sait pas encore valider ne peut pas
#      faire autorité sur un merge.
#
# À rendre bloquante — c'est-à-dire à remplacer par `*linux_rules` — le jour où
# le bundle est produit par un runner et où un Pi a confirmé l'installation.
.arm64-rules: &arm64_rules
  - when: on_success
    allow_failure: true

# L'image ne se reconstruit que quand sa définition change — sans ce gate, le
# job s'ajoutait à *tout* pipeline kyberfrog, y compris une MR qui ne touche que
# l'UI React. Jamais sur un tag : `changes` n'a pas de base de comparaison sur
# un pipeline de tag et vaut alors toujours vrai, ce qui reconstruirait l'image
# à chaque release.
#
# À savoir : `latest-amd64` est un tag flottant partagé. Une MR qui modifie le
# Dockerfile le republie donc pour tout le monde — c'est ce qui permet à cette
# même MR de tester réellement sa nouvelle image. Si une telle MR est
# abandonnée, relancer ce job depuis `dev` remet le tag en place.
.image-rules: &image_rules
  - if: $CI_COMMIT_TAG
    when: never
  # Même piège sur une branche qui vient d'être créée : `changes` n'a pas de base
  # de comparaison et vaut vrai, donc l'image se reconstruisait (≈ 1 h) pour un
  # Dockerfile intact. Vu le 2026-09-20 quand `dev` a été recréée après que le
  # merge de la !12 l'a supprimée.
  - if: $CI_COMMIT_BEFORE_SHA == "0000000000000000000000000000000000000000"
    when: never
  - changes:
      - ops/docker-images/debian-linux/**/*

# 0) Unit tests. Runs on the Linux host target (no --target): the `shared` crate
#    is pure and the Win32 modules fall back to stubs, so the whole workspace
#    compiles and the tests run. Fast, parallel to build-fork, gates installer.
test:
  stage: build
  image: $WIN64_IMAGE
  script:
    - cargo test --workspace --locked

# 0b) Build the React web UI (dashboard) → ui/dist, consumed by the installer.
#     Separate Node image: the win64 image has cargo+makensis but no Node.
build-ui:
  stage: build
  image: node:22-alpine
  script:
    - cd ui
    - npm ci
    - npm run build
  artifacts:
    paths:
      - ui/dist
    expire_in: 1 day

# 1) Fork binaries bundle (cached by resolved kyber-desktop SHA).
build-fork:
  stage: build
  image: $WIN64_IMAGE
  timeout: 3h               # 1h30 timed out twice on 2026-07-06 (fork grew: lavd webcam, camera x264 graph); SaaS runners cap at 3h
  script:
    # The fork's submodules use SSH URLs (git@gitlab.com:…); a CI runner has no
    # SSH key, so clone them over token HTTPS instead (covers the whole nested
    # submodule tree via one global rewrite).
    - git config --global url."https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/".insteadOf "git@gitlab.com:"
    - source packaging/versions.sh
    - echo "Fork ref kyber-desktop:$KYBER_DESKTOP_REF"
    - |
      COMMIT_SHA=$(git ls-remote "https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/${KYBER_DESKTOP_PROJECT}.git" "$KYBER_DESKTOP_REF" | cut -f1)
      [ -z "$COMMIT_SHA" ] && COMMIT_SHA="$KYBER_DESKTOP_REF"
      echo "Resolved to SHA: $COMMIT_SHA"
    - |
      CACHE_URL="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${FORK_PACKAGE}/${COMMIT_SHA}/${FORK_BUNDLE_ZIP}"
      if curl --head --fail -H "JOB-TOKEN: ${CI_JOB_TOKEN}" "$CACHE_URL" 2>/dev/null; then
        echo "Cache hit — downloading prebuilt fork bundle."
        curl -L -H "JOB-TOKEN: ${CI_JOB_TOKEN}" "$CACHE_URL" -o "$FORK_BUNDLE_ZIP"
      else
        echo "Cache miss — building the fork from source."
        # $KYBER_DESKTOP_REF may be a pinned commit SHA (reproducible release),
        # which `git clone --branch` rejects — init + fetch the SHA instead
        # (GitLab's Gitaly allows fetching by SHA).
        git init kyber-desktop
        git -C kyber-desktop remote add origin \
          "https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/${KYBER_DESKTOP_PROJECT}.git"
        git -C kyber-desktop fetch --depth 1 origin "$COMMIT_SHA"
        git -C kyber-desktop checkout --detach FETCH_HEAD
        git -C kyber-desktop submodule update --init --recursive --depth 1 --jobs 4
        # kymedia 0.27 requires meson >= 1.10 but the registry image still
        # ships 1.7 and has no pip — install it via apt, then let pip's
        # /usr/local/bin/meson shadow the old one until the ops-pinned
        # image is rebuilt (see docs/dev/backlog.md, #37).
        apt-get update -qq && apt-get install -y -qq python3-pip
        python3 -m pip install --break-system-packages 'meson>=1.10' \
          || python3 -m pip install 'meson>=1.10'
        # Full compile output blows GitLab's 4 MiB trace limit (truncated logs
        # made the 2026-07-06 timeouts undiagnosable): log to a file (kept as
        # artifact) and emit a one-line-per-minute heartbeat in the job trace.
        ( cd kyber-desktop && KYBER_STAGING_DIRECTORY=kyberfrog-fork-bundle ./build-win32.sh -p ) > fork-build.log 2>&1 &
        BUILD_PID=$!
        while kill -0 "$BUILD_PID" 2>/dev/null; do
          echo "[$(date -u +%H:%M:%S)] $(tail -1 fork-build.log 2>/dev/null | cut -c1-160)"
          sleep 60
        done
        if ! wait "$BUILD_PID"; then
          echo "=== fork build FAILED — last 300 lines of fork-build.log ==="
          tail -300 fork-build.log
          exit 1
        fi
        mv kyber-desktop/${FORK_BUNDLE_ZIP} "$CI_PROJECT_DIR/"
        curl --fail -H "JOB-TOKEN: ${CI_JOB_TOKEN}" \
          --upload-file "$FORK_BUNDLE_ZIP" "$CACHE_URL" || echo "Warning: cache upload failed"
      fi
  artifacts:
    when: always              # keep fork-build.log even (especially) on failure
    paths:
      - $FORK_BUNDLE_ZIP
      - fork-build.log
    expire_in: 1 day

# 1b) [Linux P1] Build + push the Linux build image from ops/docker-images/.
#     Manual: run it from the pipeline UI after touching the Dockerfile, then
#     the fork job below can use it. Built with Kaniko, not docker:dind — this
#     project's runner is the Kubernetes executor, where dind needs a
#     privileged pod the runner isn't configured to grant (`Cannot connect to
#     the Docker daemon`, tried first). Kaniko builds from a Dockerfile inside
#     an unprivileged pod and needs no daemon at all.
image-debian-linux:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  needs: []
  rules: *image_rules
  variables:
    CONTEXT: ops/docker-images/debian-linux
  before_script:
    # Kaniko has no `docker login`: it reads registry creds from
    # ~/.docker/config.json, built here from the job token GitLab injects.
    - mkdir -p /kaniko/.docker
    - |
      AUTH=$(printf '%s:%s' "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64 | tr -d '\n')
      echo "{\"auths\":{\"${CI_REGISTRY}\":{\"auth\":\"${AUTH}\"}}}" > /kaniko/.docker/config.json
  script:
    # Two tags: the floating one the other jobs consume, and an immutable one so
    # a green fork build can always be traced back to the exact image that ran it.
    - >-
      /kaniko/executor
      --context "${CI_PROJECT_DIR}/${CONTEXT}"
      --dockerfile "${CI_PROJECT_DIR}/${CONTEXT}/Dockerfile"
      --destination "$LINUX_AMD64_IMAGE"
      --destination "${CI_REGISTRY_IMAGE}/debian-linux:${CI_COMMIT_SHORT_SHA}-amd64"
      --cache=true
      --cache-repo "${CI_REGISTRY_IMAGE}/debian-linux/cache"

# 1b-bis) [#35] La même image, en arm64. Kaniko ne cross-compile pas : il produit
#     l'image de l'architecture sur laquelle il tourne. D'où le `tags:` — ce job
#     est le seul de la chaîne à *exiger* un runner ARM, et c'est justement ce
#     qu'un runner ARM sait faire en moins de 3 h, contrairement au build fork.
#
#     Le Dockerfile est partagé, pas dupliqué : il ne contient aucune référence
#     à x86 (nasm existe en arm64 sur Trixie, rustup et cargo-c se résolvent par
#     l'arch de l'hôte). Seuls les tags et le dépôt de cache changent — le cache
#     Kaniko contient des couches natives, un cache partagé serait empoisonné.
#
#     Piège de l'amorçage : ce job ne tourne qu'au changement du Dockerfile, donc
#     jamais sur la MR qui *introduit* la chaîne arm64 — et `deb-arm64` n'aurait
#     alors aucune image à tirer. `latest-arm64` a été poussé une fois à la main
#     depuis l'image locale (2026-09-22, comme `debian-win64`) ; ce job prend le
#     relais au prochain changement du Dockerfile.
image-debian-linux-arm64:
  extends: image-debian-linux
  tags:
    - $ARM64_RUNNER_TAG
  timeout: 3h
  allow_failure: true       # cf. `.arm64-rules` : arm64 ne retient personne
  script:
    - >-
      /kaniko/executor
      --context "${CI_PROJECT_DIR}/${CONTEXT}"
      --dockerfile "${CI_PROJECT_DIR}/${CONTEXT}/Dockerfile"
      --destination "$LINUX_ARM64_IMAGE"
      --destination "${CI_REGISTRY_IMAGE}/debian-linux:${CI_COMMIT_SHORT_SHA}-arm64"
      --cache=true
      --cache-repo "${CI_REGISTRY_IMAGE}/debian-linux/cache-arm64"

# 1c) [Linux P0/P4] Fork binaries bundle for Linux amd64. Same shape as the
#     Windows `build-fork` above — cache first in the Generic Package Registry
#     keyed by the resolved kyber-desktop SHA, build from source on a miss.
#
#     This job is also what *proves* P0: nothing in the workspace can compile
#     the fork for Linux today, so the cfg fix cherry-picked into
#     kymedia@7f0360f is unverified until this runs green once.
build-fork-linux:
  stage: build
  image: $LINUX_AMD64_IMAGE
  # `optional: true` : quand le Dockerfile n'a pas changé, `image-debian-linux`
  # n'est pas dans le pipeline et la dépendance est ignorée — ce job démarre
  # aussitôt. Quand il y est, ce job l'attend, et build donc sur l'image qui
  # vient d'être poussée plutôt que sur la précédente.
  needs:
    - job: image-debian-linux
      optional: true
  rules: *linux_rules
  timeout: 3h               # contrib (ffmpeg/VLC/txproto) from scratch; SaaS runners cap at 3h
  script:
    # The fork's submodules use SSH URLs; a runner has no SSH key, so rewrite
    # the whole nested tree onto token HTTPS (same as the Windows job).
    - git config --global url."https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/".insteadOf "git@gitlab.com:"
    - source packaging/versions.sh
    - echo "Fork ref kyber-desktop:$KYBER_DESKTOP_REF (linux amd64)"
    - |
      COMMIT_SHA=$(git ls-remote "https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/${KYBER_DESKTOP_PROJECT}.git" "$KYBER_DESKTOP_REF" | cut -f1)
      [ -z "$COMMIT_SHA" ] && COMMIT_SHA="$KYBER_DESKTOP_REF"
      echo "Resolved to SHA: $COMMIT_SHA"
    - |
      CACHE_URL="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${FORK_PACKAGE_LINUX}/${COMMIT_SHA}/${FORK_BUNDLE_LINUX}"
      if curl --head --fail -H "JOB-TOKEN: ${CI_JOB_TOKEN}" "$CACHE_URL" 2>/dev/null; then
        echo "Cache hit — downloading prebuilt Linux fork bundle."
        curl -L -H "JOB-TOKEN: ${CI_JOB_TOKEN}" "$CACHE_URL" -o "$FORK_BUNDLE_LINUX"
      else
        echo "Cache miss — building the fork from source for linux amd64."
        # $KYBER_DESKTOP_REF may be a pinned SHA, which `clone --branch` rejects:
        # init + fetch the SHA instead (Gitaly allows fetching by SHA).
        git init kyber-desktop
        git -C kyber-desktop remote add origin \
          "https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/${KYBER_DESKTOP_PROJECT}.git"
        git -C kyber-desktop fetch --depth 1 origin "$COMMIT_SHA"
        git -C kyber-desktop checkout --detach FETCH_HEAD
        git -C kyber-desktop submodule update --init --recursive --depth 1 --jobs 4
        # `set -x` in the fork scripts blows GitLab's 4 MiB trace limit and
        # truncated logs made past Windows timeouts undiagnosable: log to a file
        # (kept as artifact) and emit a one-line-per-minute heartbeat instead.
        ( cd kyber-desktop && ./build-linux.sh -p ) > fork-build-linux.log 2>&1 &
        BUILD_PID=$!
        while kill -0 "$BUILD_PID" 2>/dev/null; do
          echo "[$(date -u +%H:%M:%S)] $(tail -1 fork-build-linux.log 2>/dev/null | cut -c1-160)"
          sleep 60
        done
        if ! wait "$BUILD_PID"; then
          echo "=== Linux fork build FAILED — last 300 lines of fork-build-linux.log ==="
          tail -300 fork-build-linux.log
          exit 1
        fi
        mv kyber-desktop/${FORK_BUNDLE_LINUX} "$CI_PROJECT_DIR/"
        curl --fail -H "JOB-TOKEN: ${CI_JOB_TOKEN}" \
          --upload-file "$FORK_BUNDLE_LINUX" "$CACHE_URL" || echo "Warning: cache upload failed"
      fi
    - ls -lh "$FORK_BUNDLE_LINUX"
    # Sanity-check the bundle before anyone downstream trusts it.
    #
    # Le listing est écrit dans un fichier au lieu d'être branché sur `grep -q`.
    # GitLab Runner exécute les scripts avec `set -o pipefail` : `grep -q` sort
    # dès la première correspondance, `tar` prend un SIGPIPE (141), et le
    # pipeline entier remonte 141 — donc un bundle *valide* était rejeté
    # (constaté le 2026-08-18, faux négatif sur un build pourtant réussi).
    # Bonus : une seule décompression au lieu de trois.
    - |
      tar tjf "$FORK_BUNDLE_LINUX" > bundle.list
      MISSING=0
      for b in kycontroller kyavserver kyclient; do
        if grep -qE "bin/${b}\$" bundle.list; then
          echo "  ok  bin/${b}"
        else
          echo "  MANQUANT  bin/${b}"
          MISSING=1
        fi
      done
      if [ "$MISSING" -ne 0 ]; then
        echo "ERROR: bundle incomplet — contenu de bin/ :"
        grep -E '/bin/[^/]+$' bundle.list || true
        exit 1
      fi
      echo "Bundle OK: kycontroller / kyavserver / kyclient présents."
  artifacts:
    when: always              # keep the log especially on failure
    paths:
      - $FORK_BUNDLE_LINUX
      - fork-build-linux.log
    expire_in: 1 day

# 1d) [#35] Bundle fork Linux arm64 — **cache seul, jamais de build ici**.
#
#     C'est l'arbitrage de la phase, et il tient en deux faits :
#
#       * Kaniko ne cross-compile pas et le runner Kubernetes de ce projet n'a
#         pas le pod privilégié qu'exigerait `docker:dind` (`Cannot connect to
#         the Docker daemon`, essayé). Il n'y a donc pas d'image arm64 à
#         fabriquer à la volée hors d'un runner ARM.
#       * Les runners SaaS coupent à **3 h**. Le build fork amd64 natif coûte
#         déjà ~1 h 30 ; en natif sur le seul runner ARM du tier gratuit
#         (`saas-linux-small-arm64`, 2 vCPU / 8 Go) il ne passe pas, et émulé il
#         n'en est pas question.
#
#     Le bundle est donc construit **sur le poste** en conteneur linux/arm64
#     émulé (`packaging/linux/build-fork-local.sh -a arm64`), où rien ne coupe à
#     3 h, puis poussé une fois dans le Generic Package Registry à la clé du SHA
#     kyber-desktop. C'est déjà la logique de la boucle amd64, poussée d'un cran :
#     là-bas le local accélère, ici il remplace.
#
#     Conséquence assumée : sur un cache miss ce job **échoue vite** en disant
#     quoi faire, au lieu de lancer un build qui ne finira pas. Le miss n'arrive
#     qu'après un bump de `packaging/versions.sh` — au même moment que l'upload.
build-fork-linux-arm64:
  stage: build
  image: $LINUX_AMD64_IMAGE   # un cache hit, c'est un curl + un tar : aucune arch requise
  rules: *arm64_rules
  needs: []
  script:
    - source packaging/versions.sh
    - echo "Fork ref kyber-desktop:$KYBER_DESKTOP_REF (linux arm64)"
    # Même résolution que les deux autres jobs fork : le cache est keyé par le
    # SHA *résolu*, pas par la chaîne écrite dans versions.sh.
    - |
      COMMIT_SHA=$(git ls-remote "https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/${KYBER_DESKTOP_PROJECT}.git" "$KYBER_DESKTOP_REF" | cut -f1)
      [ -z "$COMMIT_SHA" ] && COMMIT_SHA="$KYBER_DESKTOP_REF"
      echo "Resolved to SHA: $COMMIT_SHA"
    - |
      CACHE_URL="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${FORK_PACKAGE_LINUX_ARM64}/${COMMIT_SHA}/${FORK_BUNDLE_LINUX_ARM64}"
      if ! curl --head --fail -H "JOB-TOKEN: ${CI_JOB_TOKEN}" "$CACHE_URL" 2>/dev/null; then
        echo "Pas de bundle arm64 pour le SHA $COMMIT_SHA."
        echo ""
        echo "Ce job ne construit pas le fork (voir le commentaire ci-dessus)."
        echo "Sur le poste de dev, depuis la racine du workspace :"
        echo ""
        echo "    packaging/linux/build-fork-local.sh -a arm64 -b"
        echo ""
        echo "puis la commande d'upload que le script imprime en fin de build."
        echo "Cible attendue : $CACHE_URL"
        exit 1
      fi
      echo "Cache hit — téléchargement du bundle arm64."
      curl -L -H "JOB-TOKEN: ${CI_JOB_TOKEN}" "$CACHE_URL" -o "$FORK_BUNDLE_LINUX_ARM64"
    - ls -lh "$FORK_BUNDLE_LINUX_ARM64"
    # Même contrôle que côté amd64, et pour la même raison : le listing va dans
    # un fichier, jamais dans `grep -q`. Sous `set -o pipefail`, `grep -q` sort
    # à la première correspondance, `tar` prend un SIGPIPE (141) et un bundle
    # valide se fait rejeter (constaté le 2026-08-18).
    - |
      tar tjf "$FORK_BUNDLE_LINUX_ARM64" > bundle.list
      MISSING=0
      for b in kycontroller kyavserver kyclient; do
        if grep -qE "bin/${b}\$" bundle.list; then
          echo "  ok  bin/${b}"
        else
          echo "  MANQUANT  bin/${b}"
          MISSING=1
        fi
      done
      if [ "$MISSING" -ne 0 ]; then
        echo "ERROR: bundle incomplet — contenu de bin/ :"
        grep -E '/bin/[^/]+$' bundle.list || true
        exit 1
      fi
      echo "Bundle OK: kycontroller / kyavserver / kyclient présents."
  artifacts:
    paths:
      - $FORK_BUNDLE_LINUX_ARM64
    expire_in: 1 day

# 2) Build kyberfrog.exe and package the installer.
installer:
  stage: package
  image: $WIN64_IMAGE
  needs:
    - job: test
      artifacts: false
    - job: build-ui
      artifacts: true
    - job: build-fork
      artifacts: true
  script:
    # The git tag is the single source of version truth: it flows through
    # build-installer.sh into KYBERFROG_VERSION (baked into the exe by build.rs)
    # and into NSIS. No Cargo.toml bump needed — nothing to keep in sync.
    - VERSION=${CI_COMMIT_TAG:-$(git describe --tags --always)}
    - echo "Building KyberFrog installer $VERSION"
    - bash packaging/build-installer.sh -f "$FORK_BUNDLE_ZIP" -v "$VERSION" -o "$CI_PROJECT_DIR/dist"
    - ls -lh "$CI_PROJECT_DIR"/dist/KyberFrog-Setup-*.exe
  artifacts:
    paths:
      - dist/KyberFrog-Setup-*.exe
    expire_in: 1 week

# 2b) [Linux P4] Paquet .deb amd64 — pendant Linux du job `installer`, avec le
#     même découpage : le binaire est compilé ici, l'UI vient de `build-ui` et
#     les binaires du fork de `build-fork-linux`.
deb:
  stage: package
  image: $LINUX_AMD64_IMAGE
  rules: *linux_rules
  needs:
    - job: test
      artifacts: false
    - job: build-ui
      artifacts: true
    - job: build-fork-linux
      artifacts: true
  script:
    # Sur un tag, le tag EST la version — même source de vérité que l'installeur
    # Windows. Hors tag on ne passe **pas** `-v` : `git describe --tags --always`
    # sur le clone peu profond de la CI retombe souvent sur le seul SHA court, or
    # une version Debian doit commencer par un chiffre — `dpkg-deb` refuserait le
    # paquet. Sans `-v`, build-deb.sh dérive « <version Cargo>~<sha> », valide.
    - |
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        bash packaging/linux/build-deb.sh -f "$FORK_BUNDLE_LINUX" -v "$CI_COMMIT_TAG" -o "$CI_PROJECT_DIR/dist"
      else
        bash packaging/linux/build-deb.sh -f "$FORK_BUNDLE_LINUX" -o "$CI_PROJECT_DIR/dist"
      fi
    - ls -lh "$CI_PROJECT_DIR"/dist/kyberfrog_*_amd64.deb
    # Garde-fou de non-régression sur l'empaquetage validé en P3 : le premier
    # passage réel de `lintian` (2026-08-21) avait sorti 411 findings mécaniques
    # — permissions des .so, changelog manquant, assets exécutables — tous
    # corrigés dans build-deb.sh. `--fail-on error` rattrape leur retour.
    # `embedded-library` est supprimé explicitement : le bundle embarque son
    # propre ffmpeg/VLC patché, par conception, exactement comme côté Windows.
    - lintian --fail-on error --suppress-tags embedded-library "$CI_PROJECT_DIR"/dist/kyberfrog_*_amd64.deb
  artifacts:
    paths:
      - dist/kyberfrog_*_amd64.deb
    expire_in: 1 week

# 2c) [#35] Paquet .deb arm64 — pendant strict de `deb`, sur un runner ARM.
#
#     Celui-là, contrairement au bundle fork, tient largement dans les 3 h d'un
#     `saas-linux-small-arm64` : il compile **un** binaire Rust, assemble un
#     arbre et appelle dpkg-deb. Et il a besoin d'être natif, pas cross :
#     `dpkg-shlibdeps` résout les ~70 dépendances système contre les paquets
#     réellement installés, et `build-deb.sh` traite son échec comme fatal —
#     précisément pour ne pas livrer un paquet aux dépendances inventées.
#
#     `-a arm64` mappe déjà vers le bundle `kyber-linux-aarch64` et la cible
#     `aarch64-unknown-linux-gnu`, qui est la cible hôte dans cette image : rien
#     à installer, `cargo build --target` la trouve telle quelle.
deb-arm64:
  stage: package
  image: $LINUX_ARM64_IMAGE
  tags:
    - $ARM64_RUNNER_TAG
  rules: *arm64_rules
  needs:
    - job: test
      artifacts: false
    - job: build-ui
      artifacts: true
    - job: build-fork-linux-arm64
      artifacts: true
    - job: image-debian-linux-arm64
      optional: true
      artifacts: false
  script:
    # Même règle de version que `deb` : sur un tag le tag fait foi, sinon on
    # laisse build-deb.sh dériver « <version Cargo>~<sha> » (une version Debian
    # doit commencer par un chiffre, ce que `git describe` sur un clone peu
    # profond ne garantit pas).
    - |
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        bash packaging/linux/build-deb.sh -a arm64 -f "$FORK_BUNDLE_LINUX_ARM64" -v "$CI_COMMIT_TAG" -o "$CI_PROJECT_DIR/dist"
      else
        bash packaging/linux/build-deb.sh -a arm64 -f "$FORK_BUNDLE_LINUX_ARM64" -o "$CI_PROJECT_DIR/dist"
      fi
    - ls -lh "$CI_PROJECT_DIR"/dist/kyberfrog_*_arm64.deb
    # Les preuves qui closent la phase, et qui n'ont de sens que sur un vrai
    # binaire arm64 : l'ELF est bien aarch64, et il ne référence aucun symbole
    # au-dessus de la glibc de Raspberry Pi OS Trixie (2.41). Ici plutôt qu'en
    # commentaire de doc : une régression de toolchain doit rougir le pipeline.
    - |
      PKG_BIN="$CI_PROJECT_DIR/pkgcheck"
      mkdir -p "$PKG_BIN" && dpkg-deb -x "$(ls "$CI_PROJECT_DIR"/dist/kyberfrog_*_arm64.deb | head -1)" "$PKG_BIN"
      for b in kyberfrog kyavserver kycontroller kyclient; do
        file "$PKG_BIN/usr/lib/kyberfrog/bin/$b" | tee -a elf.txt
      done
      if grep -qv 'ARM aarch64' elf.txt; then
        echo "ERROR: un binaire du paquet n'est pas aarch64."; exit 1
      fi
      # Seuls les ELF passent à objdump : `bin/` contient aussi ui/, *.pem,
      # *.toml, sur lesquels il sort en non-zéro — et sous le `pipefail` de
      # GitLab, un `VAR=$(… | …)` tue alors le script sans message. D'où un
      # fichier intermédiaire et des `|| true` explicites : l'absence de
      # symbole tombe sur le ERROR ci-dessous au lieu d'une mort silencieuse.
      find "$PKG_BIN"/usr/lib/kyberfrog -type f -exec file {} + > filetypes.txt
      awk -F':[[:space:]]+' '$2 ~ /^ELF /{print $1}' filetypes.txt > elfs.txt
      echo "ELF inspectés : $(wc -l < elfs.txt)"
      xargs -r objdump -T < elfs.txt > glibc-syms.txt 2>/dev/null || true
      MAXMINOR=$(grep -oE 'GLIBC_2\.[0-9]+' glibc-syms.txt | cut -d. -f2 | sort -n -u | tail -1) || true
      echo "Symbole glibc le plus haut du paquet : GLIBC_2.$MAXMINOR (Pi OS Trixie : 2.41)"
      if [ -z "$MAXMINOR" ] || [ "$MAXMINOR" -gt 41 ]; then
        echo "ERROR: GLIBC_2.$MAXMINOR dépasse la glibc 2.41 du Pi."; exit 1
      fi
    - lintian --fail-on error --suppress-tags embedded-library "$CI_PROJECT_DIR"/dist/kyberfrog_*_arm64.deb
  artifacts:
    when: always
    paths:
      - dist/kyberfrog_*_arm64.deb
      - elf.txt
    expire_in: 1 week

# 3) Publish a GitLab Release with the installer attached (tags v* only).
release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
  needs:
    - job: installer
      artifacts: true
  variables:
    # Stable per-tag download URL in the project's Generic Package Registry.
    PKG_URL: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/kyberfrog/${CI_COMMIT_TAG}/KyberFrog-Setup-${CI_COMMIT_TAG}.exe"
  script:
    - apk add --no-cache curl
    - SETUP=$(ls dist/KyberFrog-Setup-*.exe | head -1)
    - echo "Uploading $SETUP -> $PKG_URL"
    - 'curl --fail -H "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file "$SETUP" "$PKG_URL"'
    # Le texte de la release = la section du changelog de ce tag, écrite pendant
    # le développement plutôt que générée ici. Un tag de pré-version (v0.6.0-rc1)
    # n'a pas de section : le script sort vide et on retombe sur les seules
    # consignes d'installation.
    - |
      {
        sh packaging/changelog.sh extract "${CI_COMMIT_TAG#v}"
        echo
        echo "### Installation"
        echo
        echo "* **Windows** : \`KyberFrog-Setup-${CI_COMMIT_TAG}.exe\`, installeur unique (kyberfrog.exe + binaires du fork Kyber). Double-clic, il s'ajoute au PATH ; aucun setup Kyber séparé."
        echo "* **Linux amd64** : \`kyberfrog_*_amd64.deb\` ci-dessous quand la chaîne Linux a réussi (glibc >= 2.39, donc Debian 13 / Ubuntu 24.04 ou plus récent)."
        echo "* **Linux arm64** : \`kyberfrog_*_arm64.deb\` ci-dessous quand la chaîne arm64 a réussi (glibc >= 2.41, donc Raspberry Pi OS Trixie / Debian 13). Installation sur Pi pas encore validée."
      } > release-notes.md
    - cat release-notes.md
  release:
    tag_name: $CI_COMMIT_TAG
    name: "KyberFrog $CI_COMMIT_TAG"
    description: "./release-notes.md"
    assets:
      links:
        - name: "KyberFrog-Setup-${CI_COMMIT_TAG}.exe"
          url: "$PKG_URL"
          link_type: package

# 3b) [Linux P5] Le `.deb` en asset supplémentaire de la release — ajouté après
#     coup, et **pas** déclaré dans le bloc `release:` du job ci-dessus.
#
#     Raison : ce bloc est statique, on ne peut pas y omettre conditionnellement
#     un lien. Or la chaîne Linux a le droit d'échouer sur un tag
#     (`allow_failure`, voir `.deb-rules`) : la déclarer là-haut publierait une
#     release Windows ornée d'un lien mort. Un job séparé, lui, ne s'exécute
#     qu'avec un paquet en main — et s'il échoue, la release reste intacte.
#
#     `allow_failure: true` couvre aussi le cas où l'API Release Links refuserait
#     le jeton de job : le `.deb` est de toute façon déjà publié dans le Generic
#     Package Registry à une URL stable, imprimée dans la trace.
release-deb:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
      allow_failure: true
  needs:
    - job: deb
      artifacts: true
    # arm64 s'ajoute au même job plutôt que d'en ouvrir un second : la boucle
    # ci-dessous publie les paquets *présents*. Si `deb-arm64` a échoué (il a le
    # droit, cf. `.arm64-rules`), son artefact manque et la release part avec le
    # seul amd64 — même raisonnement que celui qui a sorti le `.deb` du bloc
    # `release:` statique du job `release`.
    - job: deb-arm64
      artifacts: true
      optional: true
    - job: release          # le lien ne peut s'attacher qu'à une release existante
      artifacts: false
  script:
    - apk add --no-cache curl
    - |
      DEBS=$(ls dist/kyberfrog_*.deb 2>/dev/null || true)
      if [ -z "$DEBS" ]; then
        echo "Aucun .deb en artefact : la chaîne Linux a échoué sur ce tag."
        echo "La release Windows, elle, est publiée — rien à réparer de ce côté."
        exit 1
      fi
      LINKS_API="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/releases/${CI_COMMIT_TAG}/assets/links"
      FAILED=0
      for DEB in $DEBS; do
        NAME=$(basename "$DEB")
        PKG_URL="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/kyberfrog/${CI_COMMIT_TAG}/${NAME}"
        echo "Uploading $DEB -> $PKG_URL"
        curl --fail -H "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file "$DEB" "$PKG_URL"
        echo "Attaching the asset link to release ${CI_COMMIT_TAG}"
        if curl --fail --request POST -H "JOB-TOKEN: ${CI_JOB_TOKEN}" \
             --data-urlencode "name=${NAME}" \
             --data-urlencode "url=${PKG_URL}" \
             --data "link_type=package" \
             "$LINKS_API"; then
          echo ""
          echo "Asset $NAME attaché à la release ${CI_COMMIT_TAG}."
        else
          echo ""
          echo "Lien $NAME non attaché à la release (API refusée ?)."
          echo "Le .deb reste téléchargeable : $PKG_URL"
          FAILED=1
        fi
      done
      exit "$FAILED"

# 4) Documentation site (MkDocs Material) -> GitLab Pages, default branch only.
#    Independent of the build chain (needs: []). Output must land in public/.
#    Published at https://<group>.gitlab.io/<project>/ (kyber-frog.gitlab.io/kyberfrog).
pages:
  stage: pages
  image:
    name: squidfunk/mkdocs-material:latest
    entrypoint: [""]
  needs: []
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - mkdocs build --strict --site-dir public
  artifacts:
    paths:
      - public
